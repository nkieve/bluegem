<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js" defer></script>
    <title>Blue:Gem</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #f4f1ea;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        #canvasStage {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #myCanvas {
            display: block;
            border: 1px solid #000;
        }

        #myCanvas.mobile-rotated {
            transform: rotate(90deg);
            transform-origin: center center;
        }

        @media (max-width: 700px) {
            body {
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <div id="canvasStage">
        <canvas id="myCanvas" width="1000" height="800"></canvas>
    </div>

    <script>
        
        window.addEventListener('error', (e) => {
            if (e.message && e.message.includes('message port closed')) {
                e.preventDefault();
                return true;
            }
        });
        
        
        window.addEventListener('unhandledrejection', (e) => {
            if (e.reason && e.reason.message && e.reason.message.includes('message port closed')) {
                e.preventDefault();
                return true;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('myCanvas');
            const canvasStage = document.getElementById('canvasStage');
            const ctx = canvas.getContext('2d');
            let titleScreen = null;

            const fitCanvasToViewport = () => {
                const isMobile = window.matchMedia('(max-width: 700px)').matches;
                const horizontalPadding = isMobile ? 16 : 32;
                const availableWidth = Math.max(240, window.innerWidth - horizontalPadding);
                const availableHeight = Math.max(240, window.innerHeight - horizontalPadding);

                if (isMobile) {
                    // Rotate into landscape by swapping logical width/height before applying CSS rotation.
                    canvas.width = Math.floor(availableHeight);
                    canvas.height = Math.floor(availableWidth);

                    canvas.style.width = `${canvas.width}px`;
                    canvas.style.height = `${canvas.height}px`;

                    canvasStage.style.width = `${canvas.height}px`;
                    canvasStage.style.height = `${canvas.width}px`;

                    canvas.classList.add('mobile-rotated');
                } else {
                    const width = Math.max(320, Math.min(Math.floor(availableWidth), 1000));
                    const height = Math.max(240, Math.min(Math.floor(width * 0.8), Math.floor(availableHeight)));

                    canvas.width = width;
                    canvas.height = height;

                    canvas.style.width = `${width}px`;
                    canvas.style.height = `${height}px`;

                    canvasStage.style.width = `${width}px`;
                    canvasStage.style.height = `${height}px`;

                    canvas.classList.remove('mobile-rotated');
                }
            };

            fitCanvasToViewport();

            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            titleScreen = new TitleScreen();

            const roses = [];
            const roseImage = new Image();
            roseImage.src = 'public/rose_anim.svg';

            roseImage.onload = () => {
                 for (let y = 100; y <= 700; y += 100) {
                    for (let x = -100; x >= -500; x -= 100) {
                        const randomXOffset = Math.random() * 50 - 25;
                        const randomYOffset = Math.random() * 50 - 25;
                        roses.push({ x: x + randomXOffset, y: y + randomYOffset, opacity: 0.2 });
                    }
                }
            };

            const animateRoses = () => {
                if (!canvas.isConnected) return; 

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const vortexCenter = { x: canvas.width / 2, y: canvas.height / 2 };

                titleScreen.draw(ctx, canvas);

                const glowingRoses = [];
                const normalRoses = [];

                roses.forEach((rose, i) => {
                    const isMobile = window.matchMedia('(max-width: 700px)').matches;
                    const animationScale = isMobile ? 0.65 : 1;
                    const angle = (Date.now() * 0.001 + i * 0.2) % (Math.PI * 2);
                    const radius = (200 + i * 8) * animationScale;

                    rose.x = vortexCenter.x + Math.cos(angle) * radius;
                    rose.y = vortexCenter.y + Math.sin(angle) * radius;


                    const distanceToCenter = Math.sqrt(
                        Math.pow(rose.x - vortexCenter.x, 2) + Math.pow(rose.y - vortexCenter.y, 2)
                    );

                    if (distanceToCenter < 250 && Math.random() < 0.05) {
                       glowingRoses.push(rose);
                    } else {
                       normalRoses.push(rose);
                    }
                });

                // Draw normal roses
                if (roses.length > 0) {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    normalRoses.forEach(rose => {
                        const isMobile = window.matchMedia('(max-width: 700px)').matches;
                        const roseSize = isMobile ? 65 : 100;
                        ctx.globalAlpha = rose.opacity;
                        ctx.drawImage(roseImage, rose.x, rose.y, roseSize, roseSize);
                    });

                    
                    ctx.shadowColor = 'blue';
                    ctx.shadowBlur = 20;
                    glowingRoses.forEach(rose => {
                        const isMobile = window.matchMedia('(max-width: 700px)').matches;
                        const roseSize = isMobile ? 65 : 100;
                        ctx.globalAlpha = rose.opacity;
                        ctx.drawImage(roseImage, rose.x, rose.y, roseSize, roseSize);
                    });
                }

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                requestAnimationFrame(animateRoses);
            };

            window.addEventListener('resize', () => {
                fitCanvasToViewport();
                if (titleScreen) {
                    titleScreen.draw(ctx, canvas);
                }
            });

            window.addEventListener('orientationchange', () => {
                window.setTimeout(() => {
                    fitCanvasToViewport();
                    if (titleScreen) {
                        titleScreen.draw(ctx, canvas);
                    }
                }, 100);
            });

            const checkAssetsLoaded = () => {
                if (titleScreen.assetsLoaded === titleScreen.totalAssets) {
                    titleScreen.draw(ctx, canvas);
                    titleScreen.setupHoverListeners(canvas, ctx);
                    animateRoses();
                } else {
                    requestAnimationFrame(checkAssetsLoaded);
                }
            };

            checkAssetsLoaded();
        }); 
    </script>
</body>

</html>
